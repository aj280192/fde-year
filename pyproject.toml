[project]
name = "fde-year"
version = "0.1.0"
description = "This repository documents my technical roadmap and project milestones toward becoming a Forward Deployed AI Engineer."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncio>=4.0.0",
    "fastapi[standard]>=0.142.2",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.8",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-openpyxl>=3.1.5.20261017",
]

[tool.pyright]
typeCheckingMode = "strict"
