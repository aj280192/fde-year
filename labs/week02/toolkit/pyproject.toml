[project]
name = "toolkit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ajay Madhavan Ravichandran", email = "ajmadhavanr@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
[project.scripts]
toolkit = "toolkit.cli:main"

[tool.pyright]
typeCheckingMode = "strict"